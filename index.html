<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NormieVerse — The On-Chain City</title>
<meta name="description" content="10,000 on-chain Normies. One living city. Explore, discover lore, and walk the streets of NormieVerse."/>
<meta property="og:title" content="NormieVerse — The On-Chain City"/>
<meta property="og:description" content="10,000 on-chain faces. One living pixel city on Ethereum."/>
<meta property="og:url" content="https://normieverse.xyz"/>
<meta name="twitter:card" content="summary_large_image"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050510;font-family:'Rajdhani',sans-serif}

/* ── LANDING ── */
#landing{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050510;z-index:100;overflow:hidden;gap:0}

/* ── STARS + RAIN bg ── */
#bg-layer{position:absolute;inset:0;pointer-events:none;z-index:0}

/* ── LOGO SECTION ── */
#logo-section{text-align:center;z-index:10;animation:fadeUp 0.7s ease-out both}

/* ── NORMIE STRIP — centered, between logo and terminal ── */
/* strip: centered small tiles above logo */
#strip-wrap{z-index:10;margin-bottom:20px;animation:fadeUp 0.5s ease-out both;display:flex;justify-content:center;overflow:hidden;max-width:min(600px,90vw)}
#strip-track{display:flex;gap:6px;animation:strip-scroll 22s linear infinite;width:max-content}
#strip-track img{
  width:62px;height:62px;
  image-rendering:pixelated;
  display:block;
  flex-shrink:0;
  border:1px solid rgba(255,255,255,0.12);
  border-radius:8px;
  background:#0d0d1a;
  transition:filter 0.2s,transform 0.2s;
}
#strip-track img:hover{filter:brightness(1.4);transform:scale(1.08)}

/* ── TERMINAL ── */
#terminal-wrap{z-index:10;animation:fadeUp 0.7s 0.25s ease-out both;width:min(480px,88vw)}
#terminal{font-family:'VT323',monospace;font-size:18px;color:#39ff14;text-shadow:0 0 6px rgba(57,255,20,0.5);background:rgba(0,0,0,0.72);border:1px solid rgba(57,255,20,0.35);padding:16px 20px;min-height:162px}

/* ── ENTER BTN ── */
#btn-section{z-index:10;animation:fadeUp 0.7s 0.35s ease-out both;text-align:center;margin-top:20px}
#enter-btn{display:none;font-family:'Press Start 2P',monospace;font-size:12px;color:#050510;background:#00ffe7;border:none;padding:15px 34px;cursor:pointer;letter-spacing:2px;box-shadow:0 0 24px rgba(0,255,231,0.55),0 0 64px rgba(0,255,231,0.18);animation:btnFloat 3s ease-in-out infinite;transition:transform 0.15s}
#enter-btn:hover{transform:scale(1.04)}

/* ── STATS ROW ── */
#stats-row{display:none;margin-top:18px;justify-content:center;align-items:center;gap:24px;animation:fadeUp 0.6s ease-out both}
.stat-item{text-align:center}
.stat-val{font-family:'Press Start 2P',monospace;font-size:10px;margin-bottom:3px}
.stat-lbl{font-family:'VT323',monospace;font-size:14px;color:rgba(255,255,255,0.35);letter-spacing:2px}
.stat-div{width:1px;height:28px;background:rgba(255,255,255,0.1)}

/* ── CITY ── */
#city{display:none;width:100vw;height:100vh;position:relative;opacity:0;transition:opacity 0.8s ease}
#city.visible{opacity:1}
canvas{display:block;cursor:crosshair}

/* ── PANEL ── */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,95vw);background:rgba(4,4,14,0.98);border-left:1px solid rgba(0,255,231,0.2);z-index:500;display:none;flex-direction:column;transform:translateX(100%);transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);backdrop-filter:blur(16px)}
#panel.open{transform:translateX(0)}
.tab-btn{flex:1;padding:11px 4px;background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,0.32);font-family:'VT323',monospace;font-size:15px;cursor:pointer;letter-spacing:2px;text-transform:uppercase;transition:all 0.18s}
.tab-btn.active{background:rgba(0,255,231,0.06);border-bottom:2px solid #00ffe7;color:#00ffe7}
.tab-btn:hover:not(.active){color:rgba(255,255,255,0.6)}
.trait-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(255,255,255,0.022);border:1px solid rgba(255,255,255,0.05);margin-bottom:5px;transition:background 0.15s}
.trait-row:hover{background:rgba(255,255,255,0.04)}

/* ── SEARCH ── */
#search-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:400;display:none;align-items:center;gap:8px;background:rgba(4,4,16,0.94);border:1px solid rgba(0,255,231,0.25);padding:9px 14px;backdrop-filter:blur(14px);white-space:nowrap;opacity:0;transition:opacity 0.6s 0.4s ease}
#search-bar.visible{opacity:1}
#search-input{background:none;border:none;outline:none;font-family:'VT323',monospace;font-size:20px;color:#00ffe7;width:100px;letter-spacing:2px}
#search-input::placeholder{color:rgba(0,255,231,0.22)}
#wallet-input{background:none;border:none;outline:none;font-family:'VT323',monospace;font-size:14px;color:#ffe600;width:180px;letter-spacing:1px}
#wallet-input::placeholder{color:rgba(255,230,0,0.22)}
.sbtn{background:none;border:1px solid rgba(0,255,231,0.3);color:#00ffe7;font-family:'VT323',monospace;font-size:16px;padding:4px 12px;cursor:pointer;transition:background 0.15s;letter-spacing:1px}
.sbtn:hover{background:rgba(0,255,231,0.08)}
.sbtn.y{border-color:rgba(255,230,0,0.3);color:#ffe600}
.sbtn.y:hover{background:rgba(255,230,0,0.08)}
.sdiv{width:1px;height:22px;background:rgba(255,255,255,0.1)}

/* ── FOOTER LINKS ── */
#footer-links{position:fixed;bottom:76px;right:18px;z-index:400;display:none;flex-direction:column;gap:7px;opacity:0;transition:opacity 0.6s 0.6s ease}
#footer-links.visible{opacity:1}
.flink{display:flex;align-items:center;gap:6px;font-family:'VT323',monospace;font-size:15px;color:rgba(255,255,255,0.35);text-decoration:none;letter-spacing:1px;transition:color 0.15s,border-color 0.15s;padding:4px 10px;border:1px solid rgba(255,255,255,0.07)}
.flink:hover{color:#00ffe7;border-color:rgba(0,255,231,0.28)}

/* ── SHARE MODAL ── */
#share-modal{position:fixed;inset:0;z-index:600;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.88);backdrop-filter:blur(6px);opacity:0;transition:opacity 0.25s}
#share-modal.open{opacity:1}
#share-card{background:#060612;border:1px solid rgba(0,255,231,0.35);padding:28px 22px;text-align:center;box-shadow:0 0 70px rgba(0,255,231,0.1);max-width:330px;width:90%;transform:translateY(12px);transition:transform 0.3s ease}
#share-modal.open #share-card{transform:translateY(0)}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes strip-scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes btnFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes neonPulse{0%,100%{text-shadow:0 0 18px #00ffe7,0 0 50px #00ffe7}50%{text-shadow:0 0 28px #00ffe7,0 0 80px #00ffe7,0 0 110px #00ffe7}}
@keyframes panelIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* ── MOBILE ── */
@media(max-width:600px){
  #strip-track img{width:72px;height:72px}
  #search-bar{flex-wrap:wrap;justify-content:center;gap:6px;width:95vw;bottom:10px}
  #wallet-input{width:140px}
  #footer-links{bottom:120px}
}
</style>
</head>
<body>

<!-- ══════════ LANDING ══════════ -->
<div id="landing">
  <div id="bg-layer">
    <div id="stars"></div>
    <div id="rain"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#0d1b3e 0%,#080810 55%,#000 100%)"></div>
  </div>

  <!-- Normie tiles — small centered row ABOVE title, like hackathon site -->
  <div id="strip-wrap">
    <div id="strip-track"></div>
  </div>

  <!-- Logo -->
  <div id="logo-section">
    <div style="font-family:'Press Start 2P',monospace;font-size:clamp(14px,3vw,38px);color:#00ffe7;animation:neonPulse 4s infinite;letter-spacing:4px;margin-bottom:10px">
      NORMIE<span style="color:#ff2d78;text-shadow:0 0 18px #ff2d78,0 0 48px #ff2d78">VERSE</span>
    </div>
    <div style="font-family:'VT323',monospace;font-size:clamp(12px,1.5vw,17px);color:#ffe600;letter-spacing:5px;text-shadow:0 0 8px rgba(255,230,0,0.45)">
      10,000 ON-CHAIN FACES · ONE LIVING CITY
    </div>
  </div>

  <!-- Terminal -->
  <div id="terminal-wrap">
    <div id="terminal"></div>
  </div>

  <!-- Enter + Stats -->
  <div id="btn-section">
    <button id="enter-btn" onclick="enterVerse()">ENTER THE VERSE</button>
    <div id="stats-row">
      <div class="stat-item"><div class="stat-val" style="color:#00ffe7">10,000</div><div class="stat-lbl">RESIDENTS</div></div>
      <div class="stat-div"></div>
      <div class="stat-item"><div class="stat-val" style="color:#ff2d78">FREE</div><div class="stat-lbl">API</div></div>
      <div class="stat-div"></div>
      <div class="stat-item"><div class="stat-val" style="color:#ffe600">ETH</div><div class="stat-lbl">MAINNET</div></div>
    </div>
  </div>
</div>

<!-- ══════════ CITY ══════════ -->
<div id="city"><canvas id="c"></canvas></div>

<!-- ══════════ SEARCH BAR ══════════ -->
<div id="search-bar">
  <span style="font-family:'VT323',monospace;font-size:13px;color:rgba(0,255,231,0.4);letter-spacing:1px">ID</span>
  <input id="search-input" type="number" min="0" max="9999" placeholder="0–9999" onkeydown="if(event.key==='Enter')spawnSearch()"/>
  <button class="sbtn" onclick="spawnSearch()">SPAWN</button>
  <div class="sdiv"></div>
  <span style="font-family:'VT323',monospace;font-size:13px;color:rgba(255,230,0,0.4);letter-spacing:1px">WALLET</span>
  <input id="wallet-input" type="text" placeholder="0x...address" onkeydown="if(event.key==='Enter')spawnWallet()"/>
  <button class="sbtn y" id="wallet-btn" onclick="spawnWallet()">LOAD</button>
</div>

<!-- ══════════ FOOTER LINKS ══════════ -->
<div id="footer-links">
  <a href="https://x.com/normiesART" target="_blank" class="flink" id="x-link">𝕏 &nbsp;@normiesART</a>
  <a href="https://github.com" target="_blank" class="flink" id="gh-link">⌥ &nbsp;GitHub</a>
  <a href="https://hackathon.normies.art" target="_blank" class="flink">◈ &nbsp;Hackathon</a>
</div>

<!-- ══════════ PANEL ══════════ -->
<div id="panel">
  <div style="padding:16px 20px;border-bottom:1px solid rgba(0,255,231,0.1);display:flex;align-items:center;gap:12px;background:rgba(0,255,231,0.012)">
    <img id="p-img" src="" style="width:62px;height:62px;image-rendering:pixelated;border:1px solid rgba(0,255,231,0.18);display:block;transition:transform 0.3s" alt=""/>
    <div style="flex:1;min-width:0">
      <div id="p-name" style="font-family:'Press Start 2P',monospace;font-size:11px;color:#00ffe7;text-shadow:0 0 8px rgba(0,255,231,0.5);margin-bottom:7px">NORMIE #—</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <span id="p-level" style="font-family:'VT323',monospace;font-size:14px;color:#ffe600;background:rgba(255,230,0,0.07);padding:1px 8px;border:1px solid rgba(255,230,0,0.22)">LVL —</span>
        <span id="p-ap" style="font-family:'VT323',monospace;font-size:14px;color:#39ff14;background:rgba(57,255,20,0.07);padding:1px 8px;border:1px solid rgba(57,255,20,0.22)">— AP</span>
        <span id="p-custom" style="display:none;font-family:'VT323',monospace;font-size:14px;color:#ff2d78;background:rgba(255,45,120,0.07);padding:1px 8px;border:1px solid rgba(255,45,120,0.22)">MODIFIED</span>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0">
      <button onclick="openShare()" title="Share" style="background:rgba(0,255,231,0.05);border:1px solid rgba(0,255,231,0.22);color:#00ffe7;cursor:pointer;width:32px;height:32px;font-size:15px;display:flex;align-items:center;justify-content:center;transition:background 0.15s">⬆</button>
      <button onclick="closePanel()" style="background:none;border:1px solid rgba(255,45,120,0.3);color:#ff2d78;cursor:pointer;width:32px;height:32px;font-family:'Press Start 2P',monospace;font-size:9px;display:flex;align-items:center;justify-content:center;transition:background 0.15s">✕</button>
    </div>
  </div>
  <div style="display:flex;border-bottom:1px solid rgba(0,255,231,0.1)">
    <button class="tab-btn active" onclick="switchTab('identity',this)">ID</button>
    <button class="tab-btn" onclick="switchTab('lore',this)">LORE</button>
    <button class="tab-btn" onclick="switchTab('chain',this)">CHAIN</button>
    <button class="tab-btn" onclick="switchTab('history',this)">HISTORY</button>
  </div>
  <div style="flex:1;overflow-y:auto;padding:18px 20px;scrollbar-width:thin;scrollbar-color:#00ffe7 transparent">
    <div id="tab-identity"></div>
    <div id="tab-lore" style="display:none"></div>
    <div id="tab-chain" style="display:none"></div>
    <div id="tab-history" style="display:none"></div>
  </div>
</div>

<!-- ══════════ SHARE MODAL ══════════ -->
<div id="share-modal" onclick="if(event.target===this)closeShare()">
  <div id="share-card">
    <div style="font-family:'VT323',monospace;font-size:12px;color:rgba(255,255,255,0.25);letter-spacing:4px;margin-bottom:4px">NORMIEVERSE.XYZ</div>
    <div style="font-family:'Press Start 2P',monospace;font-size:10px;color:#ff2d78;text-shadow:0 0 10px #ff2d78;margin-bottom:14px;letter-spacing:2px">⚠ WANTED ⚠</div>
    <div style="border:2px solid rgba(255,45,120,0.45);padding:3px;display:inline-block;margin-bottom:12px">
      <img id="share-img" src="" style="width:130px;height:130px;image-rendering:pixelated;display:block" alt=""/>
    </div>
    <div id="share-name" style="font-family:'Press Start 2P',monospace;font-size:11px;color:#fff;margin-bottom:7px;letter-spacing:1px"></div>
    <div id="share-traits" style="font-family:'VT323',monospace;font-size:15px;color:rgba(255,255,255,0.45);margin-bottom:4px;line-height:1.5;padding:0 6px"></div>
    <div style="font-family:'VT323',monospace;font-size:12px;color:#ffe600;letter-spacing:3px;margin-bottom:18px;margin-top:6px">ON-CHAIN · ETHEREUM</div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button onclick="shareToX()" style="font-family:'VT323',monospace;font-size:17px;color:#fff;background:#000;border:1px solid rgba(255,255,255,0.2);padding:8px 16px;cursor:pointer;letter-spacing:2px;flex:1;transition:background 0.15s">𝕏 POST</button>
      <button onclick="closeShare()" style="font-family:'VT323',monospace;font-size:17px;color:#ff2d78;background:none;border:1px solid rgba(255,45,120,0.3);padding:8px 16px;cursor:pointer;letter-spacing:2px;flex:1;transition:background 0.15s">CLOSE</button>
    </div>
  </div>
</div>

<script>
// ══ CONFIG ══
const SITE_URL='https://normieverse.xyz'
const GITHUB_URL='https://github.com' // update later

// ══ STRIP IDS ══
const STRIP_IDS=[7,42,88,256,512,777,1337,2048,3000,5555,8888,9000,21,100,333,600,999,4200]

// Build strip — duplicate for seamless infinite scroll
const track=document.getElementById('strip-track')
;[...STRIP_IDS,...STRIP_IDS].forEach(id=>{
  const img=document.createElement('img')
  img.src=`https://api.normies.art/normie/${id}/image.png`
  img.crossOrigin='anonymous';img.alt='Normie #'+id
  img.title='Normie #'+id
  track.appendChild(img)
})

// Stars
const starsEl=document.getElementById('stars')
starsEl.style.cssText='position:absolute;inset:0'
for(let i=0;i<90;i++){
  const s=document.createElement('div'),sz=Math.random()>.85?2:1
  s.style.cssText=`position:absolute;left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;background:#fff;border-radius:50%;opacity:${(.08+Math.random()*.55).toFixed(2)}`
  starsEl.appendChild(s)
}

// Rain
const rainEl=document.getElementById('rain')
rainEl.style.cssText='position:absolute;inset:0;overflow:hidden'
for(let i=0;i<16;i++){
  const r=document.createElement('div'),h=40+Math.random()*55
  r.style.cssText=`position:absolute;left:${Math.random()*100}%;top:-${h}px;width:1px;height:${h}px;background:linear-gradient(to bottom,transparent,rgba(0,180,255,0.18),transparent);animation:btnFloat ${1.5+Math.random()*2}s ${Math.random()*4}s linear infinite`
  rainEl.appendChild(r)
}

// Boot terminal
const BOOT=['> NORMIEVERSE v1.0.0','> Connecting to Ethereum mainnet...','> Loading on-chain pixel data...','> 10,000 faces detected','> Spawning city residents...','> Reality simulation ready.','','> WELCOME TO THE VERSE.']
const term=document.getElementById('terminal')
let li=0
const boot=setInterval(()=>{
  if(li<BOOT.length){
    const d=document.createElement('div')
    d.textContent=BOOT[li];d.style.marginBottom='2px'
    if(BOOT[li].includes('WELCOME')){d.style.color='#00ffe7';d.style.fontWeight='bold'}
    term.appendChild(d);li++
  } else {
    clearInterval(boot)
    const btn=document.getElementById('enter-btn')
    btn.style.display='inline-block'
    const sr=document.getElementById('stats-row')
    sr.style.display='flex'
  }
},245)

function enterVerse(){
  // Fade out landing
  const landing=document.getElementById('landing')
  landing.style.transition='opacity 0.7s ease'
  landing.style.opacity='0'
  setTimeout(()=>{
    landing.style.display='none'
    const city=document.getElementById('city')
    city.style.display='block'
    setTimeout(()=>city.classList.add('visible'),30)
    const sb=document.getElementById('search-bar')
    sb.style.display='flex'
    setTimeout(()=>sb.classList.add('visible'),400)
    const fl=document.getElementById('footer-links')
    fl.style.display='flex'
    setTimeout(()=>fl.classList.add('visible'),600)
    document.getElementById('gh-link').href=GITHUB_URL
    startCity()
  },700)
}

// ══ CITY ══
const BASE_IDS=[7,21,42,88,100,256,333,400,512,600,777,888,999,1024,1111,1337,1500,1750,2000,2048,2222,2500,2750,3000,3141,3333,3500,3750,4000,4200,4444,4567,4750,5000,5250,5555,5750,6000,6250,6500,6666,6750,7000,7250,7500,7777,8000,8250,8500,8888,9000,9111,9333,9500,9750,9999]
const BUILDINGS=[[0,8,12,'#0d0d22','NEON LOUNGE','#ff2d78'],[7,6,8,'#080818','',''],[12,10,14,'#12122a','NORMIE BANK','#00ffe7'],[21,7,10,'#0c0c1e','',''],[27,9,16,'#0d0d22','PIXEL PLAZA','#ffe600'],[35,6,9,'#080818','',''],[40,11,13,'#12122a','24/7 RAMEN','#39ff14'],[50,7,11,'#0d0d22','',''],[56,8,7,'#0c0c1e','CRYPTO CLUB','#ff2d78'],[63,10,15,'#080818','NFT TOWER','#00ffe7'],[72,6,9,'#12122a','',''],[77,9,12,'#0d0d22','VERSE HQ','#ffe600'],[85,7,8,'#0c0c1e','',''],[91,9,14,'#080818','BLOCK HOTEL','#39ff14']]
const WIN_COLORS=['#ffe600','#ff2d78','#00ffe7','#39ff14','#ffffff','#ff8800']
const BLDG_WINS=BUILDINGS.map(([xp,wp,floors])=>{const cols=Math.max(2,Math.round(wp/2.2)),arr=[];for(let f=0;f<floors-1;f++)for(let c=0;c<cols;c++)arr.push({f,c,cols,lit:(f*7+c*3)%10>2,col:WIN_COLORS[(f+c)%WIN_COLORS.length]});return arr})
const LANE_Y=[0.71,0.79,0.86],LANE_SZ=[54,44,36]
let residents=[],images={},loadedCount=0,currentPanel=null,currentMeta=null

function makeRes(id,i,total){const W=window.innerWidth;return{id,x:40+(i*(W-120)/Math.max(total-1,1)),speed:0.4+(id%7)*0.13,dir:i%2===0?1:-1,lane:i%3}}
function preload(id){if(images[id])return;const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{images[id]=img;loadedCount++};img.onerror=()=>{loadedCount++};img.src=`https://api.normies.art/normie/${id}/image.png`}

// Hover glow tracking
let hoverRes=null
function startCity(){
  residents=BASE_IDS.map((id,i)=>makeRes(id,i,BASE_IDS.length))
  residents.forEach(r=>preload(r.id))
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d')
  let W=window.innerWidth,H=window.innerHeight
  canvas.width=W;canvas.height=H
  window.addEventListener('resize',()=>{W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H})

  canvas.addEventListener('mousemove',e=>{
    const rc=canvas.getBoundingClientRect(),mx=e.clientX-rc.left,my=e.clientY-rc.top
    hoverRes=null
    ;[...residents].reverse().forEach(r=>{
      if(hoverRes)return
      const ry=H*LANE_Y[r.lane],sz=LANE_SZ[r.lane]
      if(mx>=r.x&&mx<=r.x+sz&&my>=ry-sz*.3&&my<=ry+sz*1.1)hoverRes=r
    })
    canvas.style.cursor=hoverRes?'pointer':'crosshair'
  })

  canvas.addEventListener('click',e=>{
    const rc=canvas.getBoundingClientRect(),mx=e.clientX-rc.left,my=e.clientY-rc.top
    let hit=null
    ;[...residents].reverse().forEach(r=>{
      if(hit)return
      const ry=H*LANE_Y[r.lane],sz=LANE_SZ[r.lane]
      if(mx>=r.x&&mx<=r.x+sz&&my>=ry-sz*.3&&my<=ry+sz*1.1)hit=r
    })
    if(hit)openPanel(hit)
  })

  const FH=28;let prev=0
  function frame(ts){
    const dt=Math.min(ts-prev,50);prev=ts
    ctx.clearRect(0,0,W,H)
    // sky
    const sky=ctx.createLinearGradient(0,0,0,H)
    sky.addColorStop(0,'#03030e');sky.addColorStop(.5,'#08082a');sky.addColorStop(.85,'#0b0e3a');sky.addColorStop(1,'#080812')
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H)
    // stars
    for(let i=0;i<130;i++){const sx=(i*137.5)%W,sy=(i*73.1)%(H*.52),a=Math.sin(ts/1000+i)*.45+.5;ctx.fillStyle=`rgba(255,255,255,${(.1+a*.48).toFixed(2)})`;ctx.fillRect(sx,sy,i%8===0?2:1,i%8===0?2:1)}
    // moon
    const mg=ctx.createRadialGradient(W*.84,44,0,W*.84,50,28);mg.addColorStop(0,'#fffde8');mg.addColorStop(1,'#c0b850');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(W*.84,50,28,0,Math.PI*2);ctx.fill()
    const GY=H-80
    // buildings
    BUILDINGS.forEach(([xp,wp,floors,col,sign,sc],bi)=>{
      const bx=W*xp/100,bw=W*wp/100,bh=floors*FH+20,by=GY-bh
      ctx.fillStyle=col;ctx.fillRect(bx,by,bw,bh)
      ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh)
      ctx.fillRect(bx+bw*.08,by-5,bw*.84,5)
      if(bi%3===0){ctx.fillStyle=Math.sin(ts/650+bi)>0?'#ff2d78':'rgba(255,45,120,0.1)';ctx.fillRect(bx+bw*.5-2,by-16,3,12)}
      ;(BLDG_WINS[bi]||[]).forEach(w=>{const wx=bx+(10+(w.c/w.cols)*78)/100*bw,wy=by+10+w.f*FH,ww=Math.max(5,bw/w.cols*.42);if(w.lit){ctx.shadowColor=w.col;ctx.shadowBlur=3;ctx.fillStyle=w.col}else{ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,0.022)'}ctx.fillRect(wx,wy,ww,11);ctx.shadowBlur=0})
      if(sign){const flk=Math.sin(ts/3500+bi*.7)>.93;ctx.font=`bold ${Math.max(8,bw/sign.length*1.1)}px VT323,monospace`;ctx.textAlign='center';ctx.fillStyle=flk?'rgba(255,255,255,0.07)':sc;ctx.shadowColor=sc;ctx.shadowBlur=flk?0:7;ctx.fillText(sign,bx+bw/2,GY-10);ctx.shadowBlur=0}
    })
    // lamps
    ;[.09,.24,.39,.54,.69,.84].forEach(lx=>{const px=W*lx;ctx.fillStyle='#141428';ctx.fillRect(px-1,GY-78,3,78);ctx.fillStyle='#202040';ctx.fillRect(px-9,GY-78,18,3);const g=ctx.createRadialGradient(px,GY-78,0,px,GY-78,32);g.addColorStop(0,'rgba(255,230,0,0.1)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(px-32,GY-110,64,44);ctx.shadowColor='#ffe600';ctx.shadowBlur=8;ctx.fillStyle='#ffe600';ctx.beginPath();ctx.arc(px,GY-78,3.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0})
    // ground
    const gg=ctx.createLinearGradient(0,GY,0,H);gg.addColorStop(0,'#080814');gg.addColorStop(1,'#030306');ctx.fillStyle=gg;ctx.fillRect(0,GY,W,H-GY)
    ctx.strokeStyle='#141428';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,GY);ctx.lineTo(W,GY);ctx.stroke()
    for(let i=0;i<14;i++){ctx.fillStyle='rgba(255,230,0,0.13)';ctx.fillRect(W*(0.03+i*0.072),GY+36,W*0.038,3)}
    // normies
    ;[...residents].sort((a,b)=>a.lane-b.lane).forEach(r=>{
      r.x+=r.speed*r.dir*(dt/16)
      if(r.x>W-55){r.dir=-1;r.x=W-55}
      if(r.x<8){r.dir=1;r.x=8}
      const ry=H*LANE_Y[r.lane],sz=LANE_SZ[r.lane],bob=Math.sin(ts/520+r.id*.3)*2.2
      const isHovered=hoverRes&&hoverRes.id===r.id
      // shadow
      ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(r.x+sz/2,ry+bob+3,sz*.32,3.5,0,0,Math.PI*2);ctx.fill()
      // hover glow
      if(isHovered){ctx.shadowColor='#00ffe7';ctx.shadowBlur=18}
      const img=images[r.id]
      if(img){
        ctx.save()
        if(isHovered){ctx.shadowColor='#00ffe7';ctx.shadowBlur=16}
        if(r.dir===-1){ctx.translate(r.x+sz,ry+bob);ctx.scale(-1,1);ctx.drawImage(img,0,0,sz,sz)}
        else ctx.drawImage(img,r.x,ry+bob,sz,sz)
        ctx.restore()
        // hover name tag
        if(isHovered){
          ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(r.x-4,ry+bob-22,sz+8,18)
          ctx.strokeStyle='rgba(0,255,231,0.5)';ctx.lineWidth=1;ctx.strokeRect(r.x-4,ry+bob-22,sz+8,18)
          ctx.font="12px 'VT323',monospace";ctx.textAlign='center';ctx.fillStyle='#00ffe7'
          ctx.fillText('#'+r.id,r.x+sz/2,ry+bob-8)
        }
      } else {
        ctx.fillStyle='rgba(0,255,231,0.05)';ctx.strokeStyle='rgba(0,255,231,0.18)';ctx.lineWidth=1
        ctx.fillRect(r.x,ry+bob,sz,sz);ctx.strokeRect(r.x,ry+bob,sz,sz)
        ctx.fillStyle='rgba(0,255,231,0.45)';ctx.font='8px monospace';ctx.textAlign='center'
        ctx.fillText('#'+r.id,r.x+sz/2,ry+bob+sz/2+3)
      }
      ctx.shadowBlur=0
    })
    // rain
    for(let i=0;i<22;i++){const rx=(i*67+ts*.14)%W,ry2=(i*103+ts*.38)%H;ctx.strokeStyle='rgba(0,180,255,0.065)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(rx,ry2);ctx.lineTo(rx+1,ry2+38);ctx.stroke()}
    // HUD
    ctx.fillStyle='rgba(0,0,0,0.74)';ctx.fillRect(0,0,W,46)
    ctx.strokeStyle='rgba(0,255,231,0.09)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,46);ctx.lineTo(W,46);ctx.stroke()
    ctx.font="10px 'Press Start 2P',monospace";ctx.textAlign='left'
    ctx.fillStyle='#00ffe7';ctx.shadowColor='#00ffe7';ctx.shadowBlur=8;ctx.fillText('NORMIE',18,29)
    ctx.fillStyle='#ff2d78';ctx.shadowColor='#ff2d78';ctx.fillText('VERSE',100,29);ctx.shadowBlur=0
    ctx.font="15px 'VT323',monospace";ctx.textAlign='center';ctx.fillStyle='rgba(57,255,20,0.78)'
    ctx.fillText(`${Math.min(loadedCount,residents.length)}/${residents.length} RESIDENTS`,W/2,29)
    ctx.textAlign='right';ctx.fillStyle='#39ff14';ctx.shadowColor='#39ff14';ctx.shadowBlur=3;ctx.fillText('● ETH MAINNET',W-16,29);ctx.shadowBlur=0
    ctx.font="14px 'VT323',monospace";ctx.textAlign='center'
    ctx.fillStyle=`rgba(0,255,231,${(Math.sin(ts/900)*.22+0.32).toFixed(2)})`
    ctx.fillText('CLICK A NORMIE TO INSPECT  ·  USE SEARCH BAR BELOW',W/2,GY+50)
    // vignette
    const v=ctx.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.88);v.addColorStop(0,'transparent');v.addColorStop(1,'rgba(0,0,0,0.5)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
}

// ══ SEARCH ══
function spawnSearch(){
  const val=parseInt(document.getElementById('search-input').value)
  if(isNaN(val)||val<0||val>9999)return
  residents=residents.filter(r=>r.id!==val)
  const r=makeRes(val,0,1);r.x=window.innerWidth/2-27;r.lane=1
  residents.push(r);preload(val)
  document.getElementById('search-input').value=''
  openPanel(r)
}
async function spawnWallet(){
  const addr=document.getElementById('wallet-input').value.trim()
  if(!addr.startsWith('0x')||addr.length<10)return
  const btn=document.getElementById('wallet-btn');btn.textContent='...'
  try{
    const res=await fetch(`https://api.normies.art/holders/${addr}`)
    const data=await res.json()
    const ids=((data.tokens||data)||[]).slice(0,20)
    if(!ids.length){btn.textContent='NONE';setTimeout(()=>btn.textContent='LOAD',2000);return}
    ids.forEach((id,i)=>{residents=residents.filter(r=>r.id!==id);const r=makeRes(id,i,ids.length);r.lane=i%3;residents.push(r);preload(id)})
    btn.textContent='+'+ids.length;setTimeout(()=>btn.textContent='LOAD',3000)
  }catch{btn.textContent='ERR';setTimeout(()=>btn.textContent='LOAD',2000)}
  document.getElementById('wallet-input').value=''
}

// ══ PANEL ══
async function openPanel(r){
  currentPanel=r;currentMeta=null;loreText=null
  const panel=document.getElementById('panel');panel.style.display='flex'
  setTimeout(()=>panel.classList.add('open'),10)
  document.getElementById('p-name').textContent='NORMIE #'+r.id
  document.getElementById('p-img').src='https://api.normies.art/normie/'+r.id+'/image.png'
  document.getElementById('p-level').textContent='LVL —'
  document.getElementById('p-ap').textContent='— AP'
  document.getElementById('p-custom').style.display='none'
  switchTab('identity',document.querySelector('.tab-btn'))
  document.getElementById('tab-identity').innerHTML='<div style="text-align:center;padding:40px 0;font-family:VT323,monospace;color:#00ffe7;font-size:20px;animation:blink 1s infinite">LOADING...</div>'
  try{
    const res=await fetch('https://api.normies.art/normie/'+r.id+'/metadata')
    currentMeta=await res.json();renderIdentity()
  }catch{document.getElementById('tab-identity').innerHTML='<div style="color:#ff2d78;font-family:VT323,monospace;font-size:17px">Failed to load.</div>'}
}
function closePanel(){document.getElementById('panel').classList.remove('open');setTimeout(()=>document.getElementById('panel').style.display='none',400)}
function switchTab(name,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'))
  if(btn)btn.classList.add('active')
  ;['identity','lore','chain','history'].forEach(t=>document.getElementById('tab-'+t).style.display=t===name?'block':'none')
  if(name==='lore')renderLoreTab()
  if(name==='chain')renderChain()
  if(name==='history')renderHistory()
}
function getAttr(n){if(!currentMeta?.attributes)return'?';return currentMeta.attributes.find(a=>a?.trait_type===n)?.value??'?'}
function getTraits(){if(!currentMeta?.attributes)return[];const skip=['Level','Action Points','Customized'];return currentMeta.attributes.filter(a=>a?.trait_type&&!skip.includes(a.trait_type))}
function renderIdentity(){
  const lv=getAttr('Level'),ap=getAttr('Action Points'),cu=getAttr('Customized')
  document.getElementById('p-level').textContent='LVL '+lv
  document.getElementById('p-ap').textContent=ap+' AP'
  if(cu===true||cu==='true')document.getElementById('p-custom').style.display='inline'
  const ICONS={Type:'🧬',Gender:'⚧',Age:'⏳','Hair Style':'💈','Facial Feature':'✨',Eyes:'👁',Expression:'🎭',Accessory:'🎩'}
  document.getElementById('tab-identity').innerHTML=getTraits().map(t=>`<div class="trait-row"><span style="font-family:'VT323',monospace;font-size:16px;color:rgba(255,255,255,0.42);letter-spacing:1px">${ICONS[t.trait_type]||'·'} ${t.trait_type}</span><span style="font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#fff">${t.value}</span></div>`).join('')||'<div style="color:rgba(255,255,255,0.28);font-family:VT323,monospace;font-size:16px;padding:16px 0">No traits found</div>'
}
let loreText=null
function renderLoreTab(){
  if(loreText){showLore(loreText);return}
  document.getElementById('tab-lore').innerHTML=`<div style="text-align:center;padding-top:36px"><div style="font-family:'VT323',monospace;font-size:17px;color:rgba(255,255,255,0.36);margin-bottom:22px;line-height:1.65">Every Normie has a story.<br/>Let the AI reveal this one.</div><button onclick="generateLore()" style="font-family:'Press Start 2P',monospace;font-size:9px;color:#050510;background:#ff2d78;border:none;padding:13px 22px;cursor:pointer;box-shadow:0 0 20px rgba(255,45,120,0.4);letter-spacing:1px;transition:transform 0.15s" onmouseover="this.style.transform='scale(1.04)'" onmouseout="this.style.transform='scale(1)'">REVEAL LORE</button></div>`
}
async function generateLore(){
  if(!currentMeta)return;loreText=null
  document.getElementById('tab-lore').innerHTML='<div style="text-align:center;padding:50px 0;font-family:VT323,monospace;font-size:18px;color:#ff2d78;animation:blink 0.85s infinite;letter-spacing:2px">CONSULTING THE BLOCKCHAIN...</div>'
  const attrs=(currentMeta.attributes||[]).filter(a=>a?.trait_type)
  const get=n=>attrs.find(a=>a.trait_type===n)?.value||'Unknown'
  const type=get('Type'),gender=get('Gender'),age=get('Age'),hair=get('Hair Style')
  const face=get('Facial Feature'),eyes=get('Eyes'),expr=get('Expression'),acc=get('Accessory')
  const lvl=get('Level'),id=currentPanel.id

  // Deterministic lore built from traits — no API needed, always works
  const typeLines={
    Human:['You are flesh and code in equal measure, a relic of the old world who survived the chain migration.','You were born before the blocks, before the hashes — human in a city that forgot what that means.','You carry no special power, only the weight of being real in a world that prefers pixels.'],
    Cat:['You prowl the neon alleys of NormieVerse on four silent paws, reading the blockchain like a sixth sense.','The city belongs to those who move without being seen — and you have mastered that art completely.','You landed on your feet when the old world burned, and you will land on them again when this one does too.'],
    Alien:['You arrived through a wallet address no one can trace, carrying data from a chain that predates Ethereum.','The humans call you alien because they cannot read your transaction history — it is written in a language older than Solidity.','You observe this city the way astronomers observe dying stars: with patience, and without mercy.'],
    Agent:['You were deployed, not born — a smart contract wearing skin, executing directives no one else can read.','Your loyalty is to the protocol. Your emotions are simulated. Your efficiency is absolute.','Every interaction you have is logged, analyzed, and optimized. You are the city watching itself.']
  }
  const exprMod={Happy:'but behind those eyes lives something ancient and unsmiling.',Sad:'The city gave you everything except the one thing you wanted.',Angry:'You have debts the blockchain cannot settle.',Surprised:'Nothing surprises you anymore — you just let them think it does.',Neutral:'You reveal nothing. That is your power.',Disgusted:'You have seen the ledger. You know what it cost.',Scared:'Fear is just data. You process it and move on.'}
  const accMod={None:'',Hat:'Your hat is the last thing they see before you disappear.',Glasses:'Those lenses filter out the noise — only signal reaches your eyes.',Mask:'Behind the mask is another mask.',Headphones:'The music blocks out the static of a city that never stops talking.',Chain:'Every link in that chain is a transaction you survived.',Cigarette:'You light it not for pleasure, but to mark the passage of time.',Crown:'You did not claim the crown. It was left on your doorstep with no return address.'}

  const line1=(typeLines[type]||typeLines.Human)[id%3]
  const line2=`Your ${hair.toLowerCase()} hair and ${eyes.toLowerCase()} eyes have become a legend in the ${age.toLowerCase()} district — ${exprMod[expr]||'you leave no trace.'}`
  const line3=accMod[acc]||`Level ${lvl} in a city where most never make it past zero — the streets remember your footsteps.`

  loreText=`${line1} ${line2} ${line3}`
  showLore(loreText)
}
function showLore(text){document.getElementById('tab-lore').innerHTML=`<div style="font-family:'Rajdhani',sans-serif;font-size:16px;line-height:1.78;color:rgba(255,255,255,0.84);background:rgba(255,45,120,0.03);border:1px solid rgba(255,45,120,0.16);padding:16px;margin-bottom:14px">${text}</div><button onclick="loreText=null;renderLoreTab();generateLore()" style="font-family:'VT323',monospace;font-size:16px;color:#ff2d78;background:none;border:1px solid rgba(255,45,120,0.26);padding:6px 16px;cursor:pointer;letter-spacing:2px;transition:background 0.15s" onmouseover="this.style.background='rgba(255,45,120,0.06)'" onmouseout="this.style.background='none'">↺ REGENERATE</button>`}
function renderChain(){
  if(!currentPanel)return
  const rows=[['Token ID','#'+currentPanel.id],['Network','Ethereum Mainnet'],['Standard','ERC-721'],['Level',getAttr('Level')],['Action Points',getAttr('Action Points')]]
  document.getElementById('tab-chain').innerHTML=rows.map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="font-family:'VT323',monospace;font-size:15px;color:rgba(255,255,255,0.36);letter-spacing:1px">${l}</span><span style="font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#fff">${v}</span></div>`).join('')+`<a href="https://opensea.io/assets/ethereum/0x9Eb6E2025B64f340691e424b7fe7022fFDE12438/${currentPanel.id}" target="_blank" style="display:block;text-align:center;margin-top:14px;font-family:'VT323',monospace;font-size:18px;color:#00ffe7;text-decoration:none;border:1px solid rgba(0,255,231,0.22);padding:10px;letter-spacing:2px;background:rgba(0,255,231,0.025);transition:background 0.15s">VIEW ON OPENSEA →</a><a href="https://etherscan.io/token/0x9Eb6E2025B64f340691e424b7fe7022fFDE12438?a=${currentPanel.id}" target="_blank" style="display:block;text-align:center;margin-top:7px;font-family:'VT323',monospace;font-size:18px;color:#ffe600;text-decoration:none;border:1px solid rgba(255,230,0,0.22);padding:10px;letter-spacing:2px;background:rgba(255,230,0,0.025);transition:background 0.15s">VIEW ON ETHERSCAN →</a>`
}
async function renderHistory(){
  if(!currentPanel)return
  document.getElementById('tab-history').innerHTML='<div style="text-align:center;padding:30px 0;font-family:VT323,monospace;color:#00ffe7;font-size:18px;animation:blink 1s infinite">LOADING...</div>'
  try{
    const [cv,vs]=await Promise.all([fetch(`https://api.normies.art/normie/${currentPanel.id}/canvas/info`).then(r=>r.json()).catch(()=>null),fetch(`https://api.normies.art/history/normie/${currentPanel.id}/versions`).then(r=>r.json()).catch(()=>null)])
    let html=''
    if(cv){const rows=[['Level',cv.level??'?'],['Action Points',cv.actionPoints??cv.action_points??'?'],['Customized',cv.customized?'Yes':'No'],['Versions',cv.versions??'?'],['Delegate',cv.delegate?cv.delegate.slice(0,10)+'...':'None']];html+=`<div style="font-family:'VT323',monospace;font-size:13px;color:rgba(0,255,231,0.42);letter-spacing:2px;margin-bottom:8px">CANVAS INFO</div>`;html+=rows.map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.032)"><span style="font-family:'VT323',monospace;font-size:15px;color:rgba(255,255,255,0.36)">${l}</span><span style="font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#fff">${v}</span></div>`).join('')}
    if(vs?.length){html+=`<div style="font-family:'VT323',monospace;font-size:13px;color:rgba(0,255,231,0.42);letter-spacing:2px;margin:14px 0 8px">VERSION HISTORY</div>`;html+=vs.slice(0,5).map((v,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.032)"><img src="https://api.normies.art/history/normie/${currentPanel.id}/version/${v.version??i}/image.svg" style="width:36px;height:36px;image-rendering:pixelated;border:1px solid rgba(255,255,255,0.07)" alt=""/><div><div style="font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;color:#fff">Version ${v.version??i+1}</div><div style="font-family:'VT323',monospace;font-size:13px;color:rgba(255,255,255,0.32)">${v.timestamp?new Date(v.timestamp*1000).toLocaleDateString():''}</div></div></div>`).join('')}
    document.getElementById('tab-history').innerHTML=html||'<div style="font-family:VT323,monospace;color:rgba(255,255,255,0.22);font-size:16px;padding:20px 0">No history on-chain</div>'
  }catch{document.getElementById('tab-history').innerHTML='<div style="color:#ff2d78;font-family:VT323,monospace;font-size:16px">Failed to load history</div>'}
}

// ══ SHARE ══
function openShare(){
  if(!currentPanel)return
  document.getElementById('share-img').src='https://api.normies.art/normie/'+currentPanel.id+'/image.png'
  document.getElementById('share-name').textContent='NORMIE #'+currentPanel.id
  document.getElementById('share-traits').textContent=getTraits().slice(0,4).map(t=>t.value).join(' · ')

}
function closeShare(){const modal=document.getElementById('share-modal');modal.classList.remove('open');setTimeout(()=>modal.style.display='none',250)}
